apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-clusters
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - matrix:
        generators:
          # Dimension 1: environments from Git
          - git:
              repoURL: https://github.com/Kiruthik25/Argocd-project.git
              revision: main
              directories:
                - path: "*"

          # Dimension 2: clusters (explicit, simple)
          - list:
              elements:
                - region: mumbai
                  clusterName: in-cluster
                - region: nvirginia
                  clusterName: https://github.com/Kiruthik25/Argocd-project.git

  template:
    metadata:
      name: "app-{{.path.basename}}-{{.region}}"
    spec:
      project: default

      source:
        repoURL: https://github.com/Kiruthik25/Argocd-project.git
        targetRevision: main
        path: "{{.path.basename}}/manifests"

      destination:
        name: "{{.clusterName}}"
        namespace: "app-{{.path.basename}}-ns"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
